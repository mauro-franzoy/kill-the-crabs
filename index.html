<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kill the Crabs</title>
    <link rel="stylesheet" href="resources/v1.3/styles.css">
</head>
<body>
    <div id="repo-link">repo: <a href="https://github.com/mauro-franzoy/kill-the-crabs/" target="_blank" rel="noopener noreferrer">https://github.com/mauro-franzoy/kill-the-crabs/</a></div>
    <div id="game-hud">
        <div id="game-instructions" class="game-board">Use arrows and spacebar.<br>Do not use shift + space bar.</div>
        <div id="game-data" class="game-board">
            <div class="game-info">Score: <span id="score">0</span></div>
            <div class="game-info">Lives: <span id="lives">3</span></div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="touch-controls" aria-label="Touch game controls">
        <div id="touch-dpad" aria-label="Movement controls">
            <button type="button" data-direction="ArrowUp" aria-label="Move up">UP</button>
            <button type="button" data-direction="ArrowLeft" aria-label="Move left">LEFT</button>
            <button type="button" data-direction="ArrowDown" aria-label="Move down">DOWN</button>
            <button type="button" data-direction="ArrowRight" aria-label="Move right">RIGHT</button>
        </div>
        <div id="touch-attacks">
            <button type="button" data-touch-action="hit" aria-label="Regular hit">Hit</button>
            <button type="button" data-touch-action="cook" aria-label="Special cooking attack">Cook</button>
        </div>
    </div>
    <script src="resources/v1.3/logic.js"></script>
    <script src="https://storage.ko-fi.com/cdn/widget/Widget_2.js"></script>
    <script type="text/javascript">kofiwidget2.init('Support me on Ko-fi', '#72a4f2', 'P3S22359A3');kofiwidget2.draw();</script>
</body>
</html>
